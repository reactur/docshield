[build]
command = "npx next build"
publish = "out"

# Static export: every page is emitted as a directory (e.g. /split-pdf/index.html).
# Map pretty URLs to the exported HTML files so refreshing a deep link
# no longer 404s on Netlify.
[[redirects]]
from = "/split-pdf"
to = "/split-pdf/index.html"
status = 200

[[redirects]]
from = "/merge-pdf"
to = "/merge-pdf/index.html"
status = 200

[[redirects]]
from = "/compress-pdf"
to = "/compress-pdf/index.html"
status = 200

[[redirects]]
from = "/redact-pdf"
